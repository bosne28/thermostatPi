<head>
    <meta charset="UTF-8">
    <title>Homify</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>
    <script src="printData.js"></script>
    
    <center><div class="gauge__bar"></div>
    <div class="gauge">
        <div class="gauge__body">
            <div class="gauge__cover"></div>
        </div>
        <div id="gauge__text">N/A</div>
        <div id="gauge__bar"><img src="bar.png" style="min-height: 80px;"></div>
        <img id="humShow" src="hum.png" />
        <div id="humVal"></div>
    </div></center>
    <input type="number" id="temperature" value="24" min="5" max="40" step="0.1" style="scale:2; position: absolute; top:180px; left:85px; z-index: 3;">
    <input type="button" onclick="sendTemperature()" value="SET"style="scale:2; position: absolute; top:240px; left:95px; z-index: 3;">
    <div id="listHist"><center><a href="daylog.csv">Raportul Zilei de Azi</a><hr />
    <a href="monthlog.csv">Raport Medie Zilnică</a></a><hr />
    <a href="dailylogs">Istoric Rapoarte</a></center></div>
    <iframe src="index2.html" style="border:none; width:100%; height:700px; position: absolute; top:500px;"></iframe>
    <script>
        function sendTemperature() {
            var temp = document.getElementById('temperature').value;
            var xhr = new XMLHttpRequest();
            xhr.open('POST', 'index.php', true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState == 4 && xhr.status == 200) {
                    alert('Temperatură setată');
                }
            };
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            xhr.send('temperature=' + temp);
        }
    </script>
</body>
